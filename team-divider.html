<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チーム分けアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
    }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

    header { text-align: center; padding: 24px 0 20px; }
    header h1 { font-size: 26px; font-weight: 800; color: #1c1c1e; letter-spacing: -0.3px; }
    header p { font-size: 13px; color: #8e8e93; margin-top: 4px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .card-title {
      font-size: 11px; font-weight: 700; color: #8e8e93;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
    }

    /* Radio */
    .radio-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .radio-btn {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; padding: 7px 14px;
      border: 2px solid #e5e5ea; border-radius: 20px;
      font-size: 14px; font-weight: 500;
      transition: all 0.15s; user-select: none;
    }
    .radio-btn input[type="radio"] { display: none; }
    .radio-btn.selected { border-color: #007aff; background: #eef4ff; color: #007aff; font-weight: 600; }

    /* Inputs */
    input[type="number"], input[type="text"] {
      border: 2px solid #e5e5ea; border-radius: 10px;
      padding: 10px 13px; font-size: 15px;
      transition: border-color 0.2s; outline: none; font-family: inherit;
    }
    input[type="number"] { width: 90px; }
    input[type="text"] { width: 100%; }
    input:focus { border-color: #007aff; }

    textarea {
      border: 2px solid #e5e5ea; border-radius: 10px;
      padding: 12px 13px; font-size: 15px; width: 100%;
      min-height: 110px; resize: vertical;
      transition: border-color 0.2s; outline: none;
      line-height: 1.7; font-family: inherit;
    }
    textarea:focus { border-color: #007aff; }

    .hint { font-size: 12px; color: #8e8e93; margin-top: 6px; line-height: 1.5; }
    .inline-row { display: flex; align-items: center; gap: 10px; }

    /* Attribute tags */
    .member-tag-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid #f2f2f7; flex-wrap: wrap;
    }
    .member-tag-row:last-child { border-bottom: none; }
    .member-name-lbl {
      font-size: 14px; font-weight: 600; min-width: 72px;
      padding-top: 4px; word-break: break-all; flex-shrink: 0;
    }
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; align-items: center; min-width: 0; }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 3px;
      background: #eef4ff; color: #007aff;
      border-radius: 10px; padding: 3px 9px; font-size: 13px; font-weight: 500;
    }
    .remove-tag { cursor: pointer; font-size: 15px; opacity: 0.65; line-height: 1; }
    .remove-tag:hover { opacity: 1; }
    .add-tag-inp {
      border: 1.5px dashed #c7c7cc; border-radius: 10px;
      padding: 3px 9px; font-size: 13px; width: 85px;
      outline: none; font-family: inherit; color: #1c1c1e; background: transparent;
    }
    .add-tag-inp:focus { border-color: #007aff; }

    /* Fixed assignment */
    .fixed-row {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 0; border-bottom: 1px solid #f2f2f7;
    }
    .fixed-row:last-child { border-bottom: none; }
    .fixed-name { font-size: 14px; font-weight: 600; min-width: 72px; flex-shrink: 0; word-break: break-all; }
    .fixed-arrow { color: #8e8e93; font-size: 13px; }
    select {
      border: 2px solid #e5e5ea; border-radius: 9px;
      padding: 6px 8px; font-size: 14px; background: white;
      outline: none; color: #1c1c1e; font-family: inherit; flex: 1; min-width: 0;
    }
    select:focus { border-color: #007aff; }

    /* Buttons */
    .btn-primary {
      display: block; width: 100%; padding: 15px;
      background: #007aff; color: white; border: none;
      border-radius: 13px; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      font-family: inherit; letter-spacing: 0.2px;
    }
    .btn-primary:hover { background: #0063d1; }
    .btn-primary:active { transform: scale(0.99); }

    .btn-sub {
      padding: 10px 16px; background: #f2f2f7; color: #007aff;
      border: none; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .btn-sub:hover { background: #e5e5ea; }

    .btn-green {
      padding: 10px 16px; background: #e8f8ee; color: #28a745;
      border: none; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-green:hover { background: #d4f0dd; }

    .btn-red {
      padding: 10px 16px; background: #fff1f0; color: #ff3b30;
      border: none; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-red:hover { background: #ffe0de; }

    .btn-outline {
      padding: 8px 16px; background: transparent; color: #007aff;
      border: 2px solid #007aff; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

    /* Error */
    .error-box {
      background: #fff1f0; border: 1.5px solid #ffcdd1;
      border-radius: 10px; padding: 10px 14px;
      color: #c0392b; font-size: 14px; margin-bottom: 12px; display: none;
    }
    .error-box.show { display: block; }

    /* Results */
    #results-section { display: none; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .team-card { border-radius: 14px; padding: 12px 14px 10px; will-change: transform, opacity; }

    /* Editable team name inside card */
    .team-name-inp {
      background: transparent; border: none;
      border-bottom: 2px solid rgba(255,255,255,0.35);
      color: white; font-size: 17px; font-weight: 800;
      width: 100%; outline: none; padding: 0 0 5px; margin-bottom: 8px;
      font-family: inherit; cursor: text; letter-spacing: 0.2px;
    }
    .team-name-inp:focus { border-bottom-color: rgba(255,255,255,0.85); }
    .team-name-inp::placeholder { color: rgba(255,255,255,0.5); }

    .team-member-item {
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2);
      font-size: 15px; font-weight: 500; color: white;
    }
    .team-member-item:last-child { border-bottom: none; padding-bottom: 0; }
    .member-tags-mini { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
    .tag-mini {
      font-size: 11px; background: rgba(255,255,255,0.3);
      border-radius: 5px; padding: 1px 6px; color: white;
    }

    /* 8 team colors */
    .tc-0 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .tc-1 { background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); }
    .tc-2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .tc-3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .tc-4 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    .tc-5 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    .tc-6 { background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); }
    .tc-7 { background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%); }

    /* Screenshot mode */
    .screenshot-back { display: none; margin-bottom: 14px; }
    body.ss-mode .screenshot-back { display: flex; justify-content: flex-start; }
    body.ss-mode .input-zone { display: none !important; }
    body.ss-mode .action-row { display: none !important; }
    body.ss-mode .card-title.result-title { display: none; }
    body.ss-mode .ss-title { display: block !important; }
    body.ss-mode #results-section { display: block !important; }
    body.ss-mode .results-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    body.ss-mode header p { display: none; }
    body.ss-mode .lock-bar { display: none !important; }

    .ss-title {
      display: none; text-align: center;
      font-size: 22px; font-weight: 800; color: #1c1c1e; padding: 0 0 14px;
    }

    /* Restore notice */
    .restore-notice { font-size: 12px; color: #34c759; font-weight: 600; margin-top: 4px; }

    /* ロック状態 */
    .input-zone.locked { opacity: 0.42; pointer-events: none; user-select: none; }
    .lock-bar {
      display: none; background: #fffbe6; border: 1.5px solid #ffe082;
      border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
      font-size: 13px; color: #7a6500; font-weight: 500;
      align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .lock-bar.show { display: flex; }
    .lock-bar span { flex: 1; min-width: 120px; }
    .lock-bar .lock-btns { display: flex; gap: 8px; flex-shrink: 0; }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      header h1 { font-size: 22px; }
      .results-grid { grid-template-columns: 1fr; }
      .container { padding: 12px 12px 36px; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>チーム分けアプリ</h1>
    <p>公平でバランスのよいチーム分けをサポートします</p>
  </header>

  <div class="lock-bar" id="lock-bar">
    <span>🔒 設定がロックされています</span>
    <div class="lock-btns">
      <button class="btn-sub" onclick="unlockOnly()">設定を編集する</button>
      <button class="btn-red" onclick="resetAll()">最初からやり直す</button>
    </div>
  </div>

  <!-- 入力エリア -->
  <div class="input-zone" id="input-zone">

    <!-- Step 1: メンバー入力 -->
    <div class="card">
      <div class="card-title">① メンバー入力</div>
      <div class="radio-group">
        <label class="radio-btn" id="lbl-count-mode">
          <input type="radio" name="input-mode" value="count">人数のみ
        </label>
        <label class="radio-btn selected" id="lbl-name-mode">
          <input type="radio" name="input-mode" value="names" checked>名前を入力
        </label>
      </div>

      <div id="count-mode-area" class="hidden">
        <div class="inline-row">
          <input type="number" id="member-count" min="2" max="500" placeholder="例：20">
          <span style="font-size:15px;">人</span>
        </div>
        <p class="hint">チームにはメンバー1・2・3…と番号で表示されます</p>
      </div>

      <div id="names-mode-area">
        <textarea id="names-ta" placeholder="田中&#10;佐藤&#10;鈴木&#10;山田&#10;（1行に1人ずつ入力）"></textarea>
        <p class="hint">改行で区切って1行1人ずつ入力してください</p>
        <p id="name-count-label" style="font-size:14px;font-weight:600;color:#007aff;margin-top:6px;min-height:20px;"></p>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <button class="btn-sub" onclick="parseNames()">名前を読み込む ▶</button>
          <button class="btn-sub" id="restore-btn" style="display:none;color:#34c759;border:none;background:#edfaf1;" onclick="restoreFromStorage()">📋 前回のメンバーを呼び出す</button>
        </div>
      </div>
    </div>

    <!-- Step 2: 属性タグ -->
    <div class="card hidden" id="attr-card">
      <div class="card-title">② 属性タグ（任意）</div>
      <p class="hint" style="margin-bottom:12px;">タグを設定するとバランスよく振り分けます。入力してEnterで追加。</p>
      <div id="tags-list"></div>
    </div>

    <!-- Step 3: チーム設定 -->
    <div class="card">
      <div class="card-title">③ チーム設定</div>
      <div class="radio-group">
        <label class="radio-btn selected" id="lbl-tc-mode">
          <input type="radio" name="team-mode" value="count" checked>チーム数を指定
        </label>
        <label class="radio-btn" id="lbl-ts-mode">
          <input type="radio" name="team-mode" value="size">1チームの人数を指定
        </label>
      </div>
      <div class="inline-row">
        <input type="number" id="team-val" min="2" max="100" placeholder="例：3">
        <span style="font-size:15px;" id="team-unit">チーム</span>
      </div>
      <p class="hint" id="team-hint" style="margin-top:6px;"></p>
    </div>

    <!-- Step 4: 固定メンバー -->
    <div class="card hidden" id="fixed-card">
      <div class="card-title">④ 固定メンバー（任意）</div>
      <p class="hint" style="margin-bottom:12px;">特定チームに入れたいメンバーを選べます。指定しない場合は自動で振り分けます。</p>
      <div id="fixed-list"></div>
      <p class="hint hidden" id="fixed-hint-nocount" style="color:#ff9500;">先にチーム設定でチーム数を入力してください</p>
    </div>

    <div class="error-box" id="err-box"></div>
    <button class="btn-primary" onclick="divideTeams()">チーム分けする！</button>
  </div>

  <!-- 結果エリア -->
  <div id="results-section">
    <div class="screenshot-back">
      <button class="btn-outline" onclick="exitSS()">← 入力に戻る</button>
    </div>

    <div class="card">
      <div class="card-title result-title">チーム分け結果 <span style="font-size:11px;color:#8e8e93;font-weight:400;">（チーム名はタップして編集できます）</span></div>
      <div class="ss-title">チーム分け結果</div>

      <div class="results-grid" id="results-grid"></div>

      <div class="action-row">
        <button class="btn-sub" onclick="enterSS()">スクショ用に表示</button>
        <button class="btn-green" onclick="downloadPNG()">画像として保存</button>
        <button class="btn-sub" onclick="redivide()">もう一度ランダムに分ける</button>
        <button class="btn-red" onclick="resetAll()">最初からやり直す</button>
      </div>
    </div>
  </div>

</div>

<script>
  /* ---- State ---- */
  let members    = [];    // [{name, tags:[]}]
  let savedConfig = null; // {pool, tc, fixed}
  let lastTeams  = null;  // 最後の分け結果
  let teamNames  = [];    // 編集可能なチーム名

  const TEAM_COLORS = [
    ['#667eea','#764ba2'], ['#f5576c','#f093fb'],
    ['#4facfe','#00f2fe'], ['#43e97b','#38f9d7'],
    ['#fa709a','#fee140'], ['#a18cd1','#fbc2eb'],
    ['#f7971e','#ffd200'], ['#43cea2','#185a9d'],
  ];

  /* ---- LocalStorage: 呼び出しボタンの表示判定 ---- */
  (function initRestoreBtn() {
    const saved = localStorage.getItem('td_members');
    if (!saved) return;
    const names = saved.split('\n').map(s => s.trim()).filter(s => s);
    if (names.length < 2) return;
    document.getElementById('restore-btn').style.display = 'inline-flex';
  })();

  /* ---- 前回のメンバーを呼び出す ---- */
  function restoreFromStorage() {
    const saved = localStorage.getItem('td_members');
    if (!saved) return;
    const names = saved.split('\n').map(s => s.trim()).filter(s => s);
    if (names.length < 2) return;

    document.getElementById('names-ta').value = saved;
    document.getElementById('name-count-label').textContent = `現在 ${names.length} 人入力中`;
    document.getElementById('restore-btn').style.display = 'none';

    members = names.map(name => ({ name, tags: [] }));
    renderTagsList();
    refreshFixedList();
    toggle('attr-card', true);
    toggle('fixed-card', true);
    hideErr();
  }

  /* ---- Radio styling ---- */
  function setupRadio(name, pairs) {
    document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
      r.addEventListener('change', () => {
        pairs.forEach(([val, lblId]) => {
          document.getElementById(lblId).classList.toggle('selected', r.value === val && r.checked);
        });
      });
    });
  }
  setupRadio('input-mode', [['count','lbl-count-mode'],['names','lbl-name-mode']]);
  setupRadio('team-mode',  [['count','lbl-tc-mode'],  ['size', 'lbl-ts-mode']]);

  /* ---- Input mode switch ---- */
  document.querySelectorAll('input[name="input-mode"]').forEach(r => {
    r.addEventListener('change', function() {
      const isNames = this.value === 'names';
      toggle('count-mode-area', !isNames);
      toggle('names-mode-area', isNames);
      if (!isNames) { toggle('attr-card', false); toggle('fixed-card', false); }
    });
  });

  /* ---- Team mode switch ---- */
  document.querySelectorAll('input[name="team-mode"]').forEach(r => {
    r.addEventListener('change', function() {
      const isSize = this.value === 'size';
      document.getElementById('team-unit').textContent = isSize ? '人 / チーム' : 'チーム';
      document.getElementById('team-hint').textContent = isSize ? '端数は最後のチームに入ります' : '';
      refreshFixedList();
    });
  });

  document.getElementById('team-val').addEventListener('input', refreshFixedList);

  /* ---- Textarea: 人数カウント & LocalStorage保存 ---- */
  document.getElementById('names-ta').addEventListener('input', function() {
    const count = this.value.split('\n').map(s => s.trim()).filter(s => s).length;
    document.getElementById('name-count-label').textContent = count > 0 ? `現在 ${count} 人入力中` : '';
    document.getElementById('restore-btn').style.display = 'none';
    localStorage.setItem('td_members', this.value);
  });

  /* ---- Parse names ---- */
  function parseNames() {
    const text = document.getElementById('names-ta').value.trim();
    if (!text) { showErr('名前を入力してください'); return; }
    const names = text.split('\n').map(s => s.trim()).filter(s => s);
    if (names.length < 2) { showErr('2人以上の名前を入力してください'); return; }
    members = names.map(name => ({ name, tags: [] }));
    renderTagsList();
    refreshFixedList();
    toggle('attr-card', true);
    toggle('fixed-card', true);
    hideErr();
  }

  /* ---- Attribute tag list ---- */
  function renderTagsList() {
    const container = document.getElementById('tags-list');
    container.innerHTML = '';
    members.forEach((m, mi) => {
      const row = document.createElement('div');
      row.className = 'member-tag-row';

      const lbl = document.createElement('span');
      lbl.className = 'member-name-lbl';
      lbl.textContent = m.name;

      const wrap = document.createElement('div');
      wrap.className = 'tags-wrap';

      m.tags.forEach((tag, ti) => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `${esc(tag)} <span class="remove-tag" onclick="removeTag(${mi},${ti})">×</span>`;
        wrap.appendChild(chip);
      });

      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'add-tag-inp'; inp.placeholder = 'タグ追加…';
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && this.value.trim()) {
          members[mi].tags.push(this.value.trim());
          this.value = '';
          renderTagsList(); refreshFixedList();
        }
      });
      wrap.appendChild(inp);
      row.appendChild(lbl); row.appendChild(wrap);
      container.appendChild(row);
    });
  }

  function removeTag(mi, ti) { members[mi].tags.splice(ti, 1); renderTagsList(); }

  /* ---- Fixed member list ---- */
  function refreshFixedList() {
    if (members.length === 0) return;
    const tc = calcTeamCount(members.length);
    const container = document.getElementById('fixed-list');
    const hintEl = document.getElementById('fixed-hint-nocount');
    container.innerHTML = '';
    if (!tc || tc < 2) { hintEl.classList.remove('hidden'); return; }
    hintEl.classList.add('hidden');

    members.forEach((m, mi) => {
      const row = document.createElement('div');
      row.className = 'fixed-row';
      const nameEl = document.createElement('span');
      nameEl.className = 'fixed-name'; nameEl.textContent = m.name;
      const arrow = document.createElement('span');
      arrow.className = 'fixed-arrow'; arrow.textContent = '→';
      const sel = document.createElement('select');
      sel.id = `fs-${mi}`;
      sel.innerHTML = `<option value="">自動で振り分け</option>`;
      for (let i = 0; i < tc; i++) {
        sel.innerHTML += `<option value="${i}">チーム ${teamLbl(i)}</option>`;
      }
      row.appendChild(nameEl); row.appendChild(arrow); row.appendChild(sel);
      container.appendChild(row);
    });
  }

  /* ---- Main divide ---- */
  function divideTeams() {
    hideErr();
    const inputMode = getRadio('input-mode');
    const teamVal = parseInt(document.getElementById('team-val').value);
    if (!teamVal || teamVal < 2) { showErr('チーム設定に2以上の数値を入力してください'); return; }

    let pool, total;
    if (inputMode === 'count') {
      total = parseInt(document.getElementById('member-count').value);
      if (!total || total < 2) { showErr('人数を2以上で入力してください'); return; }
      pool = Array.from({length: total}, (_, i) => ({ name: `${i+1}番`, tags: [] }));
    } else {
      if (members.length < 2) { showErr('「名前を読み込む」ボタンを押してください'); return; }
      pool = members.map(m => ({ name: m.name, tags: [...m.tags] }));
      total = pool.length;
    }

    const tc = calcTeamCount(total);
    if (!tc || tc < 2) { showErr('チーム設定を確認してください'); return; }
    if (tc > total) { showErr(`チーム数 (${tc}) が人数 (${total}) を超えています`); return; }

    const fixed = {};
    if (inputMode === 'names') {
      pool.forEach((_, mi) => {
        const sel = document.getElementById(`fs-${mi}`);
        if (sel && sel.value !== '') {
          const ti = parseInt(sel.value);
          if (ti < tc) fixed[mi] = ti;
        }
      });
    }

    // チーム名を初期化（分け直しのたびにリセット）
    teamNames = Array.from({length: tc}, (_, i) => `チーム${teamLbl(i)}`);
    savedConfig = { pool: pool.map(m => ({...m, tags:[...m.tags]})), tc, fixed };
    const teams = runDivide(pool, tc, fixed);
    displayResults(teams);
  }

  /* ---- Algorithm ---- */
  function runDivide(pool, tc, fixed) {
    const teams = Array.from({length: tc}, () => []);
    const fixedSet = new Set(Object.keys(fixed).map(Number));
    Object.entries(fixed).forEach(([mi, ti]) => teams[ti].push(pool[mi]));

    const free = pool.filter((_, i) => !fixedSet.has(i));
    const hasAttr = free.some(m => m.tags.length > 0);

    if (hasAttr) {
      const groups = {}; const noTag = [];
      free.forEach(m => {
        if (m.tags.length > 0) {
          const key = m.tags[0];
          (groups[key] = groups[key] || []).push(m);
        } else { noTag.push(m); }
      });
      Object.values(groups).forEach(g => { shuffle(g); roundRobin(g, teams); });
      shuffle(noTag); roundRobin(noTag, teams);
    } else {
      shuffle(free); roundRobin(free, teams);
    }
    return teams;
  }

  function roundRobin(arr, teams) {
    arr.forEach(m => {
      let min = 0;
      for (let i = 1; i < teams.length; i++) if (teams[i].length < teams[min].length) min = i;
      teams[min].push(m);
    });
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  /* ---- カードを DOM に構築して返す ---- */
  function buildCard(team, ti) {
    const card = document.createElement('div');
    card.className = `team-card tc-${ti % 8}`;
    card.style.opacity = '0';

    const nameInp = document.createElement('input');
    nameInp.type = 'text';
    nameInp.className = 'team-name-inp';
    nameInp.value = teamNames[ti];
    nameInp.addEventListener('input', function() { teamNames[ti] = this.value; });
    card.appendChild(nameInp);

    team.forEach(m => {
      const item = document.createElement('div');
      item.className = 'team-member-item';
      const nameDiv = document.createElement('div');
      nameDiv.textContent = m.name;
      item.appendChild(nameDiv);
      if (m.tags.length > 0) {
        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'member-tags-mini';
        m.tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag-mini'; span.textContent = tag;
          tagsDiv.appendChild(span);
        });
        item.appendChild(tagsDiv);
      }
      card.appendChild(item);
    });
    return card;
  }

  /* ---- Display results（シャッフル演出） ---- */
  function displayResults(teams) {
    lastTeams = teams;
    const section = document.getElementById('results-section');
    const grid    = document.getElementById('results-grid');
    grid.innerHTML = '';

    // カードを全部配置（まだ透明）
    teams.forEach((team, ti) => grid.appendChild(buildCard(team, ti)));

    // セクションを表示してスクロール
    section.style.display = 'block';
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // レイアウト確定後に位置を計算してアニメーション開始
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const gridW = grid.offsetWidth;
      const gridH = grid.offsetHeight;
      // デッキの起点：グリッド中央上
      const deckCX = gridW / 2;
      const deckCY = gridH / 2;

      grid.querySelectorAll('.team-card').forEach((card, ti) => {
        // カード中心座標（グリッド相対）
        const cardCX = card.offsetLeft + card.offsetWidth  / 2;
        const cardCY = card.offsetTop  + card.offsetHeight / 2;

        // デッキから各カードへのベクトル（逆向きに使う）
        const dx = deckCX - cardCX;
        const dy = deckCY - cardCY;

        // カードごとに少し違う傾き
        const rot = (12 + Math.random() * 10) * (ti % 2 === 0 ? 1 : -1);

        card.animate([
          {
            transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.5)`,
            opacity: 0,
            filter: 'brightness(1.8) blur(2px)',
          },
          {
            transform: `translate(${dx * 0.04}px, ${dy * 0.04}px) rotate(${rot * 0.04}deg) scale(1.07)`,
            opacity: 1,
            filter: 'brightness(1) blur(0)',
            offset: 0.72,
          },
          {
            transform: 'translate(0,0) rotate(0deg) scale(1)',
            opacity: 1,
            filter: 'brightness(1) blur(0)',
          },
        ], {
          duration: 580,
          delay: ti * 160,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'both',
        });
      });
    }));

    // 入力エリアをロック
    document.getElementById('input-zone').classList.add('locked');
    document.getElementById('lock-bar').classList.add('show');
  }

  /* ---- Screenshot mode ---- */
  function enterSS() { document.body.classList.add('ss-mode'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function exitSS()  { document.body.classList.remove('ss-mode'); }

  /* ---- PNG download (Canvas renderer) ---- */
  function downloadPNG() {
    if (!lastTeams || !lastTeams.length) return;

    const tc = lastTeams.length;
    const COLS = tc <= 2 ? tc : tc <= 4 ? 2 : 3;
    const ROWS = Math.ceil(tc / COLS);
    const CARD_W  = 230;
    const CARD_PX = 15;
    const HEADER_H = 50;
    const LINE_H   = 26;
    const CARD_PB  = 14;
    const GAP      = 14;
    const OUTER    = 26;
    const TITLE_H  = 58;

    // 各行の高さ（その行で最もメンバーの多いカードに合わせる）
    const rowHeights = Array.from({length: ROWS}, (_, r) => {
      let maxM = 0;
      for (let c = 0; c < COLS; c++) {
        const ti = r * COLS + c;
        if (ti < tc) maxM = Math.max(maxM, lastTeams[ti].length);
      }
      return HEADER_H + maxM * LINE_H + CARD_PB;
    });

    const W = COLS * CARD_W + (COLS - 1) * GAP + OUTER * 2;
    const H = rowHeights.reduce((a, b) => a + b, 0) + (ROWS - 1) * GAP + OUTER * 2 + TITLE_H;

    const DPR = 2;
    const canvas = document.createElement('canvas');
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    // 背景
    ctx.fillStyle = '#f2f2f7';
    ctx.fillRect(0, 0, W, H);

    // タイトル
    ctx.fillStyle = '#1c1c1e';
    ctx.font = `bold 20px -apple-system, "Helvetica Neue", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('チーム分け結果', W / 2, OUTER + TITLE_H / 2);

    // カード
    lastTeams.forEach((team, ti) => {
      const row = Math.floor(ti / COLS);
      const col = ti % COLS;
      const x = OUTER + col * (CARD_W + GAP);
      const y = OUTER + TITLE_H
              + rowHeights.slice(0, row).reduce((a, b) => a + b, 0)
              + row * GAP;
      const cardH = rowHeights[row];

      // グラデーション
      const [c1, c2] = TEAM_COLORS[ti % 8];
      const grad = ctx.createLinearGradient(x, y, x + CARD_W, y + cardH);
      grad.addColorStop(0, c1); grad.addColorStop(1, c2);
      canvasRoundRect(ctx, x, y, CARD_W, cardH, 13);
      ctx.fillStyle = grad; ctx.fill();

      // チーム名
      ctx.fillStyle = 'white';
      ctx.font = `bold 16px -apple-system, "Helvetica Neue", sans-serif`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(teamNames[ti] || `チーム${teamLbl(ti)}`, x + CARD_PX, y + 14);

      // 区切り線
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + CARD_PX, y + HEADER_H - 6);
      ctx.lineTo(x + CARD_W - CARD_PX, y + HEADER_H - 6);
      ctx.stroke();

      // メンバー
      team.forEach((m, mi) => {
        const my = y + HEADER_H + mi * LINE_H;
        const label = m.tags.length > 0 ? `${m.name}（${m.tags.join('・')}）` : m.name;
        const maxW = CARD_W - CARD_PX * 2;

        // 長すぎる名前はカット
        ctx.font = `14px -apple-system, "Helvetica Neue", sans-serif`;
        let display = label;
        while (ctx.measureText(display).width > maxW && display.length > 1) {
          display = display.slice(0, -1);
        }
        if (display !== label) display = display.slice(0, -1) + '…';

        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.textBaseline = 'top';
        ctx.fillText(display, x + CARD_PX, my);
      });
    });

    // PNG ダウンロード
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'チーム分け結果.png'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  function canvasRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /* ---- Redivide ---- */
  function redivide() {
    if (!savedConfig) return;
    const { pool, tc, fixed } = savedConfig;
    // チーム名は引き継ぐ（リセットしない）
    const teams = runDivide(pool.map(m => ({...m, tags:[...m.tags]})), tc, fixed);
    displayResults(teams);
  }

  /* ---- ロック解除のみ（名前・設定・結果はそのまま） ---- */
  function unlockOnly() {
    document.getElementById('input-zone').classList.remove('locked');
    document.getElementById('lock-bar').classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---- 最初からやり直す（全てリセット） ---- */
  function resetAll() {
    document.getElementById('input-zone').classList.remove('locked');
    document.getElementById('lock-bar').classList.remove('show');

    members = []; savedConfig = null; lastTeams = null; teamNames = [];
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('names-ta').value = '';
    document.getElementById('member-count').value = '';
    document.getElementById('team-val').value = '';
    document.getElementById('team-unit').textContent = 'チーム';
    document.getElementById('team-hint').textContent = '';
    document.getElementById('name-count-label').textContent = '';
    document.getElementById('tags-list').innerHTML = '';
    document.getElementById('fixed-list').innerHTML = '';
    toggle('attr-card', false); toggle('fixed-card', false);
    toggle('count-mode-area', false); toggle('names-mode-area', true);

    document.querySelector('input[name="input-mode"][value="names"]').checked = true;
    document.getElementById('lbl-name-mode').classList.add('selected');
    document.getElementById('lbl-count-mode').classList.remove('selected');

    document.querySelector('input[name="team-mode"][value="count"]').checked = true;
    document.getElementById('lbl-tc-mode').classList.add('selected');
    document.getElementById('lbl-ts-mode').classList.remove('selected');

    // LocalStorageは消さず、ボタンだけ再表示
    const saved = localStorage.getItem('td_members');
    if (saved && saved.split('\n').map(s => s.trim()).filter(s => s).length >= 2) {
      document.getElementById('restore-btn').style.display = 'inline-flex';
    }

    document.body.classList.remove('ss-mode');
    window.scrollTo({ top: 0 }); hideErr();
  }

  /* ---- Helpers ---- */
  function calcTeamCount(total) {
    const mode = getRadio('team-mode');
    const val = parseInt(document.getElementById('team-val').value);
    if (!val || val < 1) return 0;
    if (mode === 'count') return val;
    return Math.max(2, Math.ceil(total / val));
  }

  function getRadio(name) {
    return document.querySelector(`input[name="${name}"]:checked`)?.value;
  }

  function teamLbl(i) {
    return ['A','B','C','D','E','F','G','H'][i] ?? String(i + 1);
  }

  function toggle(id, show) {
    document.getElementById(id).classList.toggle('hidden', !show);
  }

  function showErr(msg) {
    const el = document.getElementById('err-box');
    el.textContent = msg; el.classList.add('show');
  }

  function hideErr() { document.getElementById('err-box').classList.remove('show'); }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
